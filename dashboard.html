<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corretora IA — Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
.topbar{background:#161b22;border-bottom:0.5px solid #30363d;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:15px;font-weight:500;color:#e6edf3;display:flex;align-items:center;gap:8px}
.logo i{color:#58a6ff;font-size:18px}
.topbar-right{display:flex;align-items:center;gap:10px}
.tag-update{font-size:11px;color:#484f58}
.btn-sec{background:#21262d;border:0.5px solid #30363d;color:#e6edf3;border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer}
.btn-sec:hover{background:#30363d}
.main{padding:24px;max-width:1200px;margin:0 auto}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:28px}
.metric{background:#161b22;border:0.5px solid #30363d;border-radius:10px;padding:16px 18px}
.metric-label{font-size:11px;color:#8b949e;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.metric-value{font-size:20px;font-weight:500;color:#e6edf3}
.metric-sub{font-size:12px;margin-top:4px}
.positive{color:#3fb950}
.negative{color:#f85149}
.neutral{color:#8b949e}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.card{background:#161b22;border:0.5px solid #30363d;border-radius:10px;padding:20px}
.card-title{font-size:13px;font-weight:500;color:#8b949e;margin-bottom:16px;display:flex;align-items:center;gap:6px}
.card-title i{font-size:15px}
.card-title .spacer{flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:#8b949e;font-weight:400;text-align:left;padding:8px 10px;border-bottom:0.5px solid #30363d;white-space:nowrap}
td{padding:9px 10px;border-bottom:0.5px solid #21262d;color:#e6edf3;white-space:nowrap}
tr:last-child td{border-bottom:none}
.ticker{font-weight:500;color:#58a6ff}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px}
.badge-acao{background:#1f3a5f;color:#79c0ff}
.badge-fii{background:#1a3a2a;color:#56d364}
.badge-cripto{background:#3a2a1a;color:#e3b341}
.badge-renda_fixa{background:#2a1a3a;color:#d2a8ff}
.add-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.add-form{grid-template-columns:1fr}}
input,select{background:#0d1117;border:0.5px solid #30363d;color:#e6edf3;border-radius:6px;padding:8px 10px;font-size:13px;width:100%}
input::placeholder{color:#484f58}
input:focus,select:focus{outline:none;border-color:#58a6ff}
select option{background:#161b22}
.btn{background:#238636;border:none;color:#fff;border-radius:6px;padding:9px 16px;font-size:13px;cursor:pointer;width:100%;margin-top:4px;grid-column:1/-1;font-weight:500}
.btn:hover{background:#2ea043}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:90vh}
.login-card{background:#161b22;border:0.5px solid #30363d;border-radius:12px;padding:36px 32px;width:360px}
.login-title{font-size:18px;font-weight:500;margin-bottom:4px}
.login-sub{font-size:13px;color:#8b949e;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:#8b949e;margin-bottom:6px}
.msg{font-size:12px;padding:8px 12px;border-radius:6px;margin-top:10px}
.msg-err{background:#3d1a1a;color:#f85149;border:0.5px solid #5a2020}
.msg-ok{background:#1a3a2a;color:#3fb950;border:0.5px solid #1a5a2a}
.tabs{display:flex;gap:4px;margin-bottom:20px}
.tab{padding:7px 16px;border-radius:6px;font-size:13px;cursor:pointer;color:#8b949e;border:0.5px solid transparent}
.tab.active{background:#21262d;border-color:#30363d;color:#e6edf3}
.donut-wrap{position:relative;display:flex;align-items:center;justify-content:center;height:180px}
.donut-center{position:absolute;text-align:center;pointer-events:none}
.donut-center .big{font-size:18px;font-weight:500;color:#e6edf3}
.donut-center .sm{font-size:11px;color:#8b949e}
.legend{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.leg-item{display:flex;align-items:center;justify-content:space-between;font-size:12px}
.leg-dot{width:8px;height:8px;border-radius:50%;margin-right:6px;flex-shrink:0}
.leg-left{display:flex;align-items:center;color:#c9d1d9}
.leg-right{color:#8b949e}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-label{width:70px;font-size:12px;color:#8b949e;text-align:right;flex-shrink:0}
.bar-track{flex:1;background:#21262d;border-radius:4px;height:8px;overflow:hidden}
.bar-fill{height:8px;border-radius:4px}
.bar-pct{font-size:12px;color:#8b949e;width:36px;text-align:right;flex-shrink:0}
.hidden{display:none}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.preco-loading{color:#484f58;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo"><i class="ti ti-chart-candle"></i> Corretora IA</div>
    <div class="topbar-right">
      <span class="tag-update" id="ultima-atualizacao"></span>
      <button class="btn-sec hidden" id="logout-btn" onclick="logout()">
        <i class="ti ti-logout" style="font-size:14px;vertical-align:-2px;margin-right:4px"></i>Sair
      </button>
    </div>
  </div>

  <div id="login-screen" class="login-wrap">
    <div class="login-card">
      <div class="login-title">Acesse sua carteira</div>
      <div class="login-sub">Plataforma de investimentos</div>
      <div class="field">
        <label>URL da API</label>
        <input type="text" id="api-url" value="https://web-production-78cb4.up.railway.app">
      </div>
      <div class="tabs">
        <div class="tab active" onclick="setTab('login',this)">Entrar</div>
        <div class="tab" onclick="setTab('registro',this)">Criar conta</div>
      </div>
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com">
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="senha" placeholder="••••••••" onkeydown="if(event.key==='Enter')autenticar()">
      </div>
      <button class="btn" id="auth-btn" onclick="autenticar()">Entrar</button>
      <div id="auth-msg"></div>
    </div>
  </div>

  <div id="dashboard-screen" class="hidden">
    <div class="main">
      <div class="metrics" id="metrics-row"></div>

      <div class="grid2">
        <div class="card">
          <div class="card-title">
            <i class="ti ti-chart-donut"></i> Alocação por ativo
            <span class="spacer"></span>
            <button class="btn-sec" onclick="carregarTudo()" style="padding:4px 10px;font-size:12px">
              <i class="ti ti-refresh" id="refresh-icon"></i>
            </button>
          </div>
          <div class="donut-wrap">
            <canvas id="donut-chart" height="180"></canvas>
            <div class="donut-center">
              <div class="big" id="donut-total">—</div>
              <div class="sm">atual</div>
            </div>
          </div>
          <div class="legend" id="donut-legend"></div>
        </div>

        <div class="card">
          <div class="card-title"><i class="ti ti-layout-distribute-horizontal"></i> Alocação por tipo</div>
          <div id="tipo-bars" style="margin-top:8px"></div>
        </div>
      </div>

      <div class="card" style="margin-bottom:28px">
        <div class="card-title"><i class="ti ti-list"></i> Posições</div>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>Ticker</th><th>Tipo</th><th>Qtd</th>
                <th>P.M.</th><th>Preço atual</th>
                <th>Investido</th><th>Valor atual</th><th>Lucro/Prej.</th><th>Var%</th>
              </tr>
            </thead>
            <tbody id="tabela-ativos"></tbody>
          </table>
        </div>
      </div>

      <div class="grid2">
        <div class="card">
          <div class="card-title"><i class="ti ti-plus"></i> Cadastrar ativo</div>
          <div class="add-form">
            <input type="text" id="n-ticker" placeholder="Ex: VALE3" style="text-transform:uppercase">
            <select id="n-tipo">
              <option value="acao">Ação</option>
              <option value="fii">FII</option>
              <option value="cripto">Cripto</option>
              <option value="renda_fixa">Renda fixa</option>
            </select>
            <button class="btn" onclick="addAtivo()">Adicionar ativo</button>
          </div>
          <div id="ativo-msg"></div>
        </div>

        <div class="card">
          <div class="card-title"><i class="ti ti-receipt"></i> Registrar compra</div>
          <div class="add-form">
            <input type="number" id="p-ativo-id" placeholder="ID do ativo" min="1" step="1">
            <input type="number" id="p-qtd" placeholder="Quantidade" step="any" min="0">
            <input type="number" id="p-preco" placeholder="Preço unitário (R$)" step="any" min="0" style="grid-column:1/-1">
            <button class="btn" onclick="addPosicao()">Registrar compra</button>
          </div>
          <div id="posicao-msg"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let TOKEN=null,API='',donutChart=null,currentTab='login';
let dadosCarteira=[],dadosPrecos={};

const CORES=['#58a6ff','#3fb950','#e3b341','#d2a8ff','#f85149','#79c0ff','#56d364','#ffa657','#ff7b72','#a5d6ff'];
const TIPO_CORES={acao:'#58a6ff',fii:'#3fb950',cripto:'#e3b341',renda_fixa:'#d2a8ff'};
const TIPO_LABEL={acao:'Ação',fii:'FII',cripto:'Cripto',renda_fixa:'Renda fixa'};

function fmt(v){return 'R$ '+(+v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function setTab(t,el){currentTab=t;document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));el.classList.add('active');document.getElementById('auth-btn').textContent=t==='login'?'Entrar':'Criar conta';}

async function autenticar(){
  API=document.getElementById('api-url').value.replace(/\/$/,'');
  const email=document.getElementById('email').value.trim();
  const senha=document.getElementById('senha').value;
  if(!email||!senha){showMsg('auth-msg','Preencha e-mail e senha','err');return;}
  document.getElementById('auth-btn').textContent='Aguarde...';
  try{
    const res=await fetch(API+(currentTab==='login'?'/login':'/registro'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,senha})});
    const data=await res.json();
    if(currentTab==='registro'&&res.ok){showMsg('auth-msg','Conta criada! Faça login.','ok');setTab('login',document.querySelector('.tab'));document.getElementById('auth-btn').textContent='Entrar';return;}
    if(data.token){
      TOKEN=data.token;
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('dashboard-screen').classList.remove('hidden');
      document.getElementById('logout-btn').classList.remove('hidden');
      carregarTudo();
    }else{showMsg('auth-msg',data.detail||'Erro','err');document.getElementById('auth-btn').textContent='Entrar';}
  }catch(e){showMsg('auth-msg','Não foi possível conectar à API','err');document.getElementById('auth-btn').textContent='Entrar';}
}

function logout(){TOKEN=null;API='';document.getElementById('login-screen').classList.remove('hidden');document.getElementById('dashboard-screen').classList.add('hidden');document.getElementById('logout-btn').classList.add('hidden');if(donutChart){donutChart.destroy();donutChart=null;}}

async function carregarTudo(){
  const icon=document.getElementById('refresh-icon');
  icon.classList.add('spin');
  try{
    const [resCart,resPrecos]=await Promise.all([
      fetch(API+'/carteira',{headers:{Authorization:'Bearer '+TOKEN}}),
      fetch(API+'/precos',{headers:{Authorization:'Bearer '+TOKEN}})
    ]);
    if(resCart.status===401){logout();return;}
    dadosCarteira=(await resCart.json()).ativos||[];
    dadosPrecos=await resPrecos.json();
    const cartData=await (await fetch(API+'/carteira',{headers:{Authorization:'Bearer '+TOKEN}})).json();
    renderTudo(cartData);
    document.getElementById('ultima-atualizacao').textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){console.error(e);}
  icon.classList.remove('spin');
}

function calcValorAtual(a){
  const p=dadosPrecos[a.ticker];
  if(p==null||p===undefined) return null;
  return +(a.quantidade)*p;
}

function renderTudo(data){
  const ativos=data.ativos||[];
  let totalAtual=0,totalInvest=0;
  ativos.forEach(a=>{
    const va=calcValorAtual(a);
    totalAtual+=(va!=null?va:(+a.valor_investido||0));
    totalInvest+=(+a.valor_investido||0);
  });
  const lucroTotal=totalAtual-totalInvest;
  const varTotal=totalInvest>0?(lucroTotal/totalInvest*100):0;

  document.getElementById('metrics-row').innerHTML=`
    <div class="metric"><div class="metric-label">Patrimônio atual</div><div class="metric-value">${fmt(totalAtual)}</div></div>
    <div class="metric"><div class="metric-label">Total investido</div><div class="metric-value">${fmt(totalInvest)}</div></div>
    <div class="metric"><div class="metric-label">Lucro / Prej.</div><div class="metric-value ${lucroTotal>=0?'positive':'negative'}">${fmt(lucroTotal)}</div><div class="metric-sub ${varTotal>=0?'positive':'negative'}">${varTotal>=0?'▲':'▼'} ${Math.abs(varTotal).toFixed(2)}%</div></div>
    <div class="metric"><div class="metric-label">Ativos</div><div class="metric-value">${ativos.length}</div></div>
  `;

  renderDonut(ativos);
  renderTipoBars(ativos);
  renderTabela(ativos);
}

function renderDonut(ativos){
  const ctx=document.getElementById('donut-chart').getContext('2d');
  if(donutChart){donutChart.destroy();}
  if(!ativos.length){document.getElementById('donut-total').textContent='R$ 0';return;}
  const valores=ativos.map(a=>{const va=calcValorAtual(a);return va!=null?va:(+(a.valor_investido||0));});
  const total=valores.reduce((s,v)=>s+v,0);
  document.getElementById('donut-total').textContent='R$ '+(total/1000).toFixed(1)+'k';
  donutChart=new Chart(ctx,{type:'doughnut',data:{labels:ativos.map(a=>a.ticker),datasets:[{data:valores,backgroundColor:CORES,borderWidth:0,hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,cutout:'72%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.label+': '+fmt(c.raw)}}}}});
  document.getElementById('donut-legend').innerHTML=ativos.map((a,i)=>{
    const v=valores[i];const pct=total>0?(v/total*100).toFixed(1):0;
    return `<div class="leg-item"><div class="leg-left"><span class="leg-dot" style="background:${CORES[i%CORES.length]}"></span>${a.ticker}</div><div class="leg-right">${pct}%</div></div>`;
  }).join('');
}

function renderTipoBars(ativos){
  const totais={};let grand=0;
  ativos.forEach(a=>{const v=calcValorAtual(a)??(+(a.valor_investido||0));totais[a.tipo]=(totais[a.tipo]||0)+v;grand+=v;});
  const el=document.getElementById('tipo-bars');
  if(!Object.keys(totais).length){el.innerHTML='<p style="color:#8b949e;font-size:13px;text-align:center;padding:20px 0">Nenhum ativo</p>';return;}
  el.innerHTML=Object.entries(totais).sort((a,b)=>b[1]-a[1]).map(([tipo,val])=>{
    const pct=grand>0?(val/grand*100).toFixed(1):0;
    return `<div class="bar-row"><div class="bar-label">${TIPO_LABEL[tipo]||tipo}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${TIPO_CORES[tipo]||'#8b949e'}"></div></div><div class="bar-pct">${pct}%</div></div>`;
  }).join('');
}

function renderTabela(ativos){
  const tbody=document.getElementById('tabela-ativos');
  if(!ativos.length){tbody.innerHTML='<tr><td colspan="9" style="color:#8b949e;text-align:center;padding:24px">Nenhum ativo cadastrado</td></tr>';return;}
  tbody.innerHTML=ativos.map(a=>{
    const pm=+(a.preco_medio||0);
    const qtd=+(a.quantidade||0);
    const invest=+(a.valor_investido||0);
    const precoAtual=dadosPrecos[a.ticker];
    const valorAtual=precoAtual!=null?qtd*precoAtual:null;
    const lucro=valorAtual!=null?valorAtual-invest:null;
    const varPct=lucro!=null&&invest>0?(lucro/invest*100):null;
    const precoCell=precoAtual!=null?fmt(precoAtual):'<span class="preco-loading">—</span>';
    const valorCell=valorAtual!=null?fmt(valorAtual):`<span class="neutral">${fmt(invest)}</span>`;
    const lucroCell=lucro!=null?`<span class="${lucro>=0?'positive':'negative'}">${fmt(lucro)}</span>`:'<span class="neutral">—</span>';
    const varCell=varPct!=null?`<span class="${varPct>=0?'positive':'negative'}">${varPct>=0?'▲':'▼'}${Math.abs(varPct).toFixed(2)}%</span>`:'<span class="neutral">—</span>';
    return `<tr>
      <td class="ticker">${a.ticker}</td>
      <td><span class="badge badge-${a.tipo}">${TIPO_LABEL[a.tipo]||a.tipo}</span></td>
      <td>${qtd.toLocaleString('pt-BR',{maximumFractionDigits:4})}</td>
      <td>${fmt(pm)}</td>
      <td>${precoCell}</td>
      <td>${fmt(invest)}</td>
      <td>${valorCell}</td>
      <td>${lucroCell}</td>
      <td>${varCell}</td>
    </tr>`;
  }).join('');
}

async function addAtivo(){
  const ticker=document.getElementById('n-ticker').value.trim().toUpperCase();
  const tipo=document.getElementById('n-tipo').value;
  if(!ticker){showMsg('ativo-msg','Informe o ticker','err');return;}
  try{
    const res=await fetch(API+'/ativo',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify({ticker,tipo})});
    const data=await res.json();
    if(res.ok){showMsg('ativo-msg','✓ Ativo cadastrado! ID: '+data.id,'ok');document.getElementById('n-ticker').value='';carregarTudo();}
    else showMsg('ativo-msg',data.detail||'Erro','err');
  }catch(e){showMsg('ativo-msg','Erro de conexão','err');}
}

async function addPosicao(){
  const ativo_id=parseInt(document.getElementById('p-ativo-id').value);
  const quantidade=parseFloat(document.getElementById('p-qtd').value);
  const preco=parseFloat(document.getElementById('p-preco').value);
  if(!ativo_id||!quantidade||!preco){showMsg('posicao-msg','Preencha todos os campos','err');return;}
  try{
    const res=await fetch(API+'/posicao',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify({ativo_id,quantidade,preco})});
    const data=await res.json();
    if(res.ok){showMsg('posicao-msg','✓ Compra registrada!','ok');['p-ativo-id','p-qtd','p-preco'].forEach(id=>document.getElementById(id).value='');carregarTudo();}
    else showMsg('posicao-msg',data.detail||'Erro','err');
  }catch(e){showMsg('posicao-msg','Erro de conexão','err');}
}

function showMsg(id,txt,tipo){
  const el=document.getElementById(id);
  el.className='msg '+(tipo==='ok'?'msg-ok':'msg-err');
  el.textContent=txt;
  setTimeout(()=>{el.textContent='';el.className='';},5000);
}
</script>
</body>
</html>
